<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>易填 Easy Apply CN</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">✦</span>
    <h1>易填 <span>Easy Apply</span></h1>
  </div>

  <div class="section">
    <h2>基本信息</h2>
    <div class="row">
      <label>姓名</label>
      <input type="text" id="name" placeholder="张三" />
    </div>
    <div class="row">
      <label>手机号</label>
      <input type="tel" id="phone" placeholder="138xxxx1234" />
    </div>
    <div class="row">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="zhangsan@gmail.com" />
    </div>
  </div>

  <div class="section">
    <h2>教育背景</h2>
    <div class="row">
      <label>学校</label>
      <input type="text" id="school" placeholder="南京大学" />
    </div>
    <div class="row">
      <label>专业</label>
      <input type="text" id="major" placeholder="应用数学" />
    </div>
    <div class="row">
      <label>毕业年份</label>
      <input type="text" id="graduationYear" placeholder="2024" />
    </div>
  </div>

  <div class="section">
    <h2>求职意向</h2>
    <div class="row">
      <label>工作年限</label>
      <input type="text" id="yearsExp" placeholder="1" />
    </div>
    <div class="row">
      <label>现居城市</label>
      <input type="text" id="currentCity" placeholder="南京" />
    </div>
    <div class="row">
      <label>期望城市</label>
      <input type="text" id="targetCity" placeholder="上海" />
    </div>
    <div class="row">
      <label>期望薪资</label>
      <input type="text" id="expectedSalary" placeholder="15k-20k" />
    </div>
  </div>

  <div class="section">
    <h2>自我介绍</h2>
    <textarea id="selfIntro" rows="4" placeholder="简短介绍自己的背景和优势..."></textarea>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-save">保存资料</button>
    <button id="fillBtn" class="btn-fill">一键填表 ✦</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
