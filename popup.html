<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>易填 Easy Apply CN</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">✦</span>
    <h1>易填 <span>Easy Apply</span></h1>
  </div>

  <div class="section">
    <h2>基本信息</h2>
    <div class="row">
      <label>姓名</label>
      <input type="text" id="name" placeholder="张三" />
    </div>
    <div class="row">
      <label>性别</label>
      <select id="gender">
        <option value="">请选择</option>
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="不限">不限</option>
      </select>
    </div>
    <div class="row">
      <label>出生年月</label>
      <input type="text" id="birthDate" placeholder="1999-06" />
    </div>
    <div class="row">
      <label>身份证号</label>
      <input type="text" id="idNumber" placeholder="32xxxxxxxxxxxx0000" />
    </div>
    <div class="row">
      <label>手机号</label>
      <input type="tel" id="phone" placeholder="138xxxx1234" />
    </div>
    <div class="row">
      <label>邮箱</label>
      <input type="email" id="email" placeholder="zhangsan@gmail.com" />
    </div>
    <div class="row">
      <label>微信号</label>
      <input type="text" id="wechat" placeholder="wxid_xxx" />
    </div>
  </div>

  <div class="section">
    <h2>个人背景</h2>
    <div class="row">
      <label>政治面貌</label>
      <select id="politicalStatus">
        <option value="">请选择</option>
        <option value="中共党员">中共党员</option>
        <option value="共青团员">共青团员</option>
        <option value="群众">群众</option>
        <option value="民主党派">民主党派</option>
      </select>
    </div>
    <div class="row">
      <label>民族</label>
      <input type="text" id="ethnicity" placeholder="汉族" />
    </div>
    <div class="row">
      <label>户籍城市</label>
      <input type="text" id="hometown" placeholder="南京" />
    </div>
    <div class="row">
      <label>现居城市</label>
      <input type="text" id="currentCity" placeholder="南京" />
    </div>
    <div class="row">
      <label>详细地址</label>
      <input type="text" id="address" placeholder="玄武区xx路xx号" />
    </div>
  </div>

  <div class="section">
    <h2>教育背景</h2>
    <div class="row">
      <label>学校</label>
      <input type="text" id="school" placeholder="南京大学" />
    </div>
    <div class="row">
      <label>学历</label>
      <select id="degree">
        <option value="">请选择</option>
        <option value="博士">博士</option>
        <option value="硕士">硕士</option>
        <option value="本科">本科</option>
        <option value="大专">大专</option>
        <option value="高中">高中及以下</option>
      </select>
    </div>
    <div class="row">
      <label>专业</label>
      <input type="text" id="major" placeholder="应用数学" />
    </div>
    <div class="row">
      <label>毕业年份</label>
      <input type="text" id="graduationYear" placeholder="2025" />
    </div>
    <div class="row">
      <label>GPA</label>
      <input type="text" id="gpa" placeholder="3.5/4.0" />
    </div>
    <div class="row">
      <label>专业排名</label>
      <input type="text" id="rankPercent" placeholder="前20%" />
    </div>
    <div class="row">
      <label>英语水平</label>
      <select id="englishLevel">
        <option value="">请选择</option>
        <option value="CET-4">CET-4（英语四级）</option>
        <option value="CET-6">CET-6（英语六级）</option>
        <option value="雅思">雅思 IELTS</option>
        <option value="托福">托福 TOEFL</option>
        <option value="专业八级">专业八级</option>
        <option value="无">无</option>
      </select>
    </div>
  </div>

  <div class="section">
    <h2>求职意向</h2>
    <div class="row">
      <label>期望职位</label>
      <input type="text" id="targetJob" placeholder="数据分析师" />
    </div>
    <div class="row">
      <label>期望行业</label>
      <input type="text" id="targetIndustry" placeholder="互联网/金融" />
    </div>
    <div class="row">
      <label>期望城市</label>
      <input type="text" id="targetCity" placeholder="上海" />
    </div>
    <div class="row">
      <label>期望薪资</label>
      <input type="text" id="expectedSalary" placeholder="15k-20k" />
    </div>
    <div class="row">
      <label>求职状态</label>
      <select id="jobStatus">
        <option value="">请选择</option>
        <option value="应届生">应届生</option>
        <option value="离职-随时到岗">离职，随时到岗</option>
        <option value="在职-月内到岗">在职，月内到岗</option>
        <option value="在职-考虑机会">在职，考虑机会</option>
        <option value="在职-暂不考虑">在职，暂不考虑</option>
      </select>
    </div>
    <div class="row">
      <label>工作年限</label>
      <input type="text" id="yearsExp" placeholder="1" />
    </div>
  </div>

  <div class="section">
    <h2>能力与介绍</h2>
    <textarea id="skills" rows="3" placeholder="Python / SQL / Excel，熟悉数据分析建模..."></textarea>
    <textarea id="selfIntro" rows="4" placeholder="简短介绍自己的背景和优势..."></textarea>
  </div>

  <div class="actions">
    <button id="saveBtn" class="btn-save">保存资料</button>
    <button id="fillBtn" class="btn-fill">一键填表 ✦</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
